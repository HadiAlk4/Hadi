<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #2e64ad;
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--sky-top);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* The stage keeps the video's aspect ratio so the sky mask always lines up
       with the band of baked-in text, whatever the window size. */
    .stage {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: max(100vw, calc(100vh * 1902 / 1080));
      aspect-ratio: 1902 / 1080;
      z-index: 0;
    }

    .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    body:not(.ready),
    body:not(.ready) * { transition: none !important; }

    .stage .ground { z-index: 3; }
    .stage .sky-mask { z-index: 4; }
    .stage .seeds { z-index: 5; }
    .stage .tint,
    .stage .stars { z-index: 6; }

    /* A still frame of the hill laid over the loop, so the grass doesn't
       snap back each time the loop restarts. Traced from the video, just
       above the grass tips and along the base of the Mac. */
    .stage .ground {
      clip-path: polygon(
        0% 96%, 4% 92.6%, 8% 91.6%, 12% 90.5%, 16% 86.6%, 20% 85.7%,
        24% 83.3%, 28% 82.2%, 32% 82.7%, 36% 82%, 40% 82.9%, 60% 80.5%,
        64% 79.6%, 68% 80.5%, 72% 81.6%, 76% 82.7%, 80% 82.9%, 84% 84.4%,
        88% 87%, 92% 89.2%, 96% 91.3%, 100% 92.4%, 100% 100%, 0% 100%
      );
    }

    .stage .seeds {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Covers the original text in the video with matching sky. */
    .stage .sky-mask {
      position: absolute;
      inset: 0;
      /* Stops sampled from the video's sky as the browser renders it,
         as % of the frame height. */
      background: linear-gradient(
        to bottom,
        #2e64ad 0%,
        #3168af 4.5%,
        #3269b0 9%,
        #366cb2 13.5%,
        #3870b6 18%,
        #3c73b7 22%,
        #3e76b9 27%,
        #4177b9 29%,
        rgba(66, 120, 187, 0) 34%
      );
    }

    /* Time of day: the whole stage (video + sky mask) is graded together so
       the mask stays invisible, then a tint layer adds the light colour. */
    .stage {
      transition: filter 2s ease;
    }

    .stage .tint {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 2s ease, background 2s ease;
    }

    .stage .stars {
      position: absolute;
      inset: 0 0 45% 0;
      opacity: 0;
      transition: opacity 2s ease;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff, transparent),
        radial-gradient(1px 1px at 27% 42%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 38% 12%, #fff, transparent),
        radial-gradient(1px 1px at 46% 55%, #fff, transparent),
        radial-gradient(1px 1px at 58% 30%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 66% 8%, #fff, transparent),
        radial-gradient(1px 1px at 73% 48%, #fff, transparent),
        radial-gradient(1px 1px at 84% 22%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 91% 60%, #fff, transparent),
        radial-gradient(1px 1px at 6% 66%, #fff, transparent),
        radial-gradient(1px 1px at 19% 80%, #fff, transparent),
        radial-gradient(1px 1px at 52% 75%, #fff, transparent),
        radial-gradient(1px 1px at 97% 35%, #fff, transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { filter: brightness(0.7); }
      to { filter: brightness(1.3); }
    }

    body { transition: background-color 2s ease; }

    body[data-time="dawn"] { background-color: #5a6ab0; }
    body[data-time="dawn"] .stage { filter: brightness(1.02) saturate(1.05); }
    body[data-time="dawn"] .tint {
      opacity: 0.5;
      mix-blend-mode: color;
      background: linear-gradient(to bottom, #5a6ab0 0%, #b89ad0 25%, #f4b2c0 45%, #ffd0a8 60%, transparent 78%);
    }

    body[data-time="sunset"] { background-color: #2e2a6a; }
    body[data-time="sunset"] .stage { filter: saturate(1.3) brightness(0.92); }
    body[data-time="sunset"] .tint {
      opacity: 0.65;
      mix-blend-mode: color;
      background: linear-gradient(to bottom, #2e2a6a 0%, #7a3e94 22%, #e0607a 40%, #ff8a48 55%, #ffb060 66%, transparent 80%);
    }

    body[data-time="night"] { background-color: #070d22; }
    body[data-time="night"] .stage { filter: brightness(0.62) saturate(0.8) hue-rotate(8deg); }
    body[data-time="night"] .tint {
      opacity: 1;
      mix-blend-mode: multiply;
      background: linear-gradient(to bottom, #1a2350 0%, #2a3a7a 60%, #3a4a80 100%);
    }
    body[data-time="night"] .stars { opacity: 1; }

    footer {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 27.7% repeat(3, 21.2%);
      padding: clamp(40px, 4.4vw, 84px) 5.5vw 0;
    }

    .brand .logo {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(40px, 3.3vw, 64px);
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .brand .tagline {
      margin-top: clamp(16px, 1.6vw, 30px);
      font-size: clamp(15px, 1.1vw, 21px);
      line-height: 1.45;
      max-width: 20em;
    }

    .brand .copyright {
      margin-top: clamp(16px, 1.6vw, 30px);
      font-size: clamp(13px, 0.92vw, 17.5px);
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .col h2 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(26px, 1.95vw, 37px);
      line-height: 1;
      margin-bottom: clamp(20px, 2.1vw, 40px);
    }

    .col ul { list-style: none; }

    .col li + li { margin-top: clamp(12px, 1.15vw, 22px); }

    .col a {
      color: var(--text);
      text-decoration: none;
      font-size: clamp(15px, 1.1vw, 21px);
      line-height: 1;
      background-image: linear-gradient(currentColor, currentColor);
      background-size: 0% 1.5px;
      background-position: 0 100%;
      background-repeat: no-repeat;
      padding-bottom: 3px;
      transition: background-size 0.3s ease;
    }

    .col a:hover,
    .col a:focus-visible {
      background-size: 100% 1.5px;
      outline: none;
    }

    @media (max-width: 760px) {
      footer {
        grid-template-columns: repeat(3, 1fr);
        row-gap: 28px;
        column-gap: 12px;
        padding: 36px 16px 0;
      }
      .brand { grid-column: 1 / -1; }
      .col h2 { font-size: 22px; margin-bottom: 14px; }
      .col a { font-size: 14px; }
      .col li + li { margin-top: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .col a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <video class="loop" src="inspo.mp4" autoplay muted playsinline></video>
    <video class="loop" src="inspo.mp4" muted playsinline preload="auto"></video>
    <video class="ground" src="inspo.mp4#t=1" muted playsinline preload="auto"></video>
    <div class="sky-mask"></div>
    <canvas class="seeds"></canvas>
    <div class="tint"></div>
    <div class="stars"></div>
  </div>

  <footer>
    <div class="brand">
      <div class="logo">hadi</div>
      <p class="tagline">Your tagline goes here,<br>on two short lines</p>
      <p class="copyright">© 2026 Hadi. All rights reserved.</p>
    </div>

    <nav class="col" aria-label="Work">
      <h2>Work</h2>
      <ul>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Experiments</a></li>
        <li><a href="#">Writing</a></li>
        <li><a href="#">Resume</a></li>
      </ul>
    </nav>

    <nav class="col" aria-label="About">
      <h2>About</h2>
      <ul>
        <li><a href="#">About me</a></li>
        <li><a href="#">Now</a></li>
        <li><a href="#">Uses</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <nav class="col" aria-label="Social Media">
      <h2>Social Media</h2>
      <ul>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Instagram</a></li>
        <li><a href="https://github.com/HadiAlk4">GitHub</a></li>
      </ul>
    </nav>
  </footer>

  <script>
    // Picks the scene from the visitor's local clock. Add ?time=night (or
    // dawn / day / sunset) to the URL to preview a scene.
    const override = new URLSearchParams(location.search).get("time");

    function timeOfDay(hour) {
      if (hour >= 5 && hour < 8) return "dawn";
      if (hour >= 8 && hour < 17) return "day";
      if (hour >= 17 && hour < 20) return "sunset";
      return "night";
    }

    function update() {
      document.body.dataset.time = override || timeOfDay(new Date().getHours());
    }

    update();
    setInterval(update, 60 * 1000);

    // Only fade between scenes when the hour changes, not on first load.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add("ready");
    }));

    // The video powers the screen on, then drifts to dusk from 2.2s and
    // switches off. Play the power-on once, then loop the stretch where the
    // sky holds steady but the grass, seeds and screen keep moving,
    // crossfading between two copies so the jump back isn't visible.
    const LOOP_START = 1.0;
    const LOOP_END = 2.15;
    const FADE = 0.35;

    let [front, back] = document.querySelectorAll(".stage video.loop");
    let fading = false;
    front.style.zIndex = 1;
    back.style.opacity = 0;
    // Seek ahead of time so the incoming copy never shows a stale frame.
    back.addEventListener("loadedmetadata", () => { back.currentTime = LOOP_START; }, { once: true });

    function crossfade() {
      fading = true;
      back.play();
      back.style.zIndex = 2;
      back.style.transition = `opacity ${FADE}s linear`;
      back.style.opacity = 1;

      setTimeout(() => {
        front.pause();
        front.style.transition = "none";
        front.style.opacity = 0;
        front.style.zIndex = 1;
        front.currentTime = LOOP_START;
        [front, back] = [back, front];
        fading = false;
      }, FADE * 1000);
    }

    function tick() {
      if (!fading && front.currentTime >= LOOP_END - FADE) crossfade();
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);

    // Dandelion seeds drifting over the video. Each follows its own random
    // path so the scene never visibly repeats, which hides the short loop.
    const canvas = document.querySelector(".seeds");
    const ctx = canvas.getContext("2d");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const SPRITE = 128;
    const rand = (min, max) => min + Math.random() * (max - min);

    // A seed seen from below (side = false): fine filaments radiating from a
    // bright centre. Seen side-on (side = true): filaments fanned upward like
    // a parachute. Both have a thin stalk and a small brown achene, softly
    // backlit.
    function makeSprite(blur, side) {
      const c = document.createElement("canvas");
      c.width = c.height = SPRITE;
      const g = c.getContext("2d");
      const cx = SPRITE / 2;
      const cy = SPRITE * (side ? 0.3 : 0.42);
      const r = SPRITE * (side ? 0.22 : 0.26);

      g.filter = `blur(${blur}px)`;
      g.shadowColor = "rgba(255, 244, 225, 0.7)";
      g.shadowBlur = 3 + blur;
      g.lineCap = "round";

      const filaments = 26 + Math.floor(Math.random() * 10);
      for (let i = 0; i < filaments; i++) {
        const a = side
          ? -Math.PI / 2 + ((i / (filaments - 1)) * 2 - 1) * 1.25 + rand(-0.06, 0.06)
          : (i / filaments) * Math.PI * 2 + rand(-0.08, 0.08);
        const len = r * rand(0.75, 1);
        // Side-on filaments rise steeply then splay out, like an umbrella.
        const lift = side ? -len * 0.35 : 0;
        g.strokeStyle = `rgba(255, 252, 245, ${rand(0.45, 0.85)})`;
        g.lineWidth = rand(0.5, 0.9);
        g.beginPath();
        g.moveTo(cx, cy);
        g.quadraticCurveTo(
          cx + Math.cos(a) * len * 0.35 + rand(-1, 1),
          cy + Math.sin(a) * len * 0.5 + lift + rand(-1, 1),
          cx + Math.cos(a) * len,
          cy + Math.sin(a) * len * (side ? 0.55 : 1)
        );
        g.stroke();
        g.fillStyle = "rgba(255, 255, 250, 0.6)";
        g.beginPath();
        g.arc(cx + Math.cos(a) * len, cy + Math.sin(a) * len * (side ? 0.55 : 1), 0.6, 0, Math.PI * 2);
        g.fill();
      }

      const stalk = r * (side ? 1.9 : 1.15);
      g.shadowBlur = 0;
      g.strokeStyle = "rgba(235, 228, 210, 0.75)";
      g.lineWidth = 0.8;
      g.beginPath();
      g.moveTo(cx, cy);
      g.lineTo(cx + 1, cy + stalk);
      g.stroke();

      g.fillStyle = "rgba(120, 92, 60, 0.9)";
      g.beginPath();
      g.ellipse(cx + 1, cy + stalk + 3, 1.3, 3.4, 0.05, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = "rgba(255, 250, 238, 0.95)";
      g.beginPath();
      g.arc(cx, cy, 1.4, 0, Math.PI * 2);
      g.fill();
      return c;
    }

    // Sharp sprites for mid-distance seeds, blurred ones for seeds close to
    // the camera (out of focus) and far away (hazy).
    const sprites = {
      sharp: [false, false, true, true, true].map((side) => makeSprite(0.3, side)),
      soft: [false, true].map((side) => makeSprite(1.2, side)),
      bokeh: [false, true].map((side) => makeSprite(3.5, side)),
    };

    let width = 0;
    let height = 0;
    let seeds = [];

    function makeSeed(fromEdge) {
      const depth = Math.random() ** 1.6; // mostly small and distant
      const near = depth > 0.88;
      const set = near ? sprites.bokeh : depth < 0.25 ? sprites.soft : sprites.sharp;
      return {
        sprite: set[Math.floor(Math.random() * set.length)],
        depth,
        size: (14 + depth * 46) * (width / 1600),
        alpha: near ? rand(0.35, 0.6) : rand(0.55, 0.9),
        x: fromEdge ? -0.05 * width : rand(0, width),
        y: rand(0.08, 0.85) * height,
        vx: (6 + depth * 26) * rand(0.7, 1.3) * (width / 1600),
        vy: rand(-3, 2) * (width / 1600),
        bob: rand(4, 14) * (width / 1600),
        phase: rand(0, Math.PI * 2),
        freq: rand(0.15, 0.45),
        tilt: rand(0.55, 1),
        spin: rand(-0.4, 0.4),
        angle: rand(-0.5, 0.5),
      };
    }

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(14 * (width / 1600)) + 6;
      seeds = Array.from({ length: count }, () => makeSeed(false));
    }

    let last = performance.now();
    function draw(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < seeds.length; i++) {
        const s = seeds[i];
        if (!reduceMotion) {
          s.phase += dt * s.freq * Math.PI * 2;
          s.x += s.vx * dt;
          s.y += (s.vy + Math.cos(s.phase) * s.bob * 0.6) * dt;
          s.angle += s.spin * dt * 0.3 + Math.sin(s.phase) * 0.004;
        }
        if (s.x > width + s.size || s.y < -s.size || s.y > height) {
          seeds[i] = makeSeed(true);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.scale(1, s.tilt);
        ctx.drawImage(s.sprite, -s.size / 2, -s.size * 0.42, s.size, s.size);
        ctx.restore();
      }

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    resize();
    new ResizeObserver(resize).observe(canvas);
    requestAnimationFrame(draw);
  </script>
</body>
</html>
