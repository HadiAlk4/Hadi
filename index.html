<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #2e64ad;
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--sky-top);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* The stage keeps the scene's aspect ratio so the screen effects always
       line up with the Mac, whatever the window size. */
    .stage {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: max(100vw, calc(100vh * 1902 / 1080));
      aspect-ratio: 1902 / 1080;
      z-index: 0;
      transition: filter 2s ease;
    }

    .stage > * {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    body:not(.ready),
    body:not(.ready) * { transition: none !important; }

    /* A still of the scene with the sky cleaned up; everything that moves
       is drawn on top. */
    .stage .plate { object-fit: cover; }

    /* The Mac's screen, traced from the plate. */
    .crt {
      left: 42.69%;
      top: 49.07%;
      width: 14.51%;
      height: 22.41%;
      right: auto;
      bottom: auto;
      border-radius: 14% / 16%;
      overflow: hidden;
    }

    .crt > * {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .crt-noise {
      mix-blend-mode: overlay;
      opacity: 0.22;
    }

    .crt-roll {
      background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.09) 45%, rgba(255, 255, 255, 0.14) 50%, transparent 60%);
      background-size: 100% 300%;
      mix-blend-mode: screen;
      animation: roll 7s linear infinite;
    }

    @keyframes roll {
      from { background-position: 0 100%; }
      to { background-position: 0 0%; }
    }

    .crt-flash {
      background: #fff;
      mix-blend-mode: soft-light;
      opacity: 0;
    }

    /* Glow that breathes with the flicker. */
    .halo {
      left: 39%;
      top: 44%;
      width: 22%;
      height: 32%;
      right: auto;
      bottom: auto;
      background: radial-gradient(closest-side, rgba(225, 205, 255, 0.35), rgba(200, 170, 255, 0.12) 60%, transparent);
      mix-blend-mode: screen;
      opacity: 0.6;
    }

    /* Power-on: dark glass, a bright line that opens to a white flash,
       then the colour bars. Driven from the script. */
    .crt-off { background: #0d0f16; }

    .crt-line {
      top: 50% !important;
      height: 100%;
      background: #fff;
      box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.7);
      transform: translateY(-50%) scaleY(0.012);
    }

    .stage .tint {
      opacity: 0;
      transition: opacity 2s ease, background 2s ease;
    }

    .stage .night {
      opacity: 0;
      transition: opacity 2s ease;
    }

    body { transition: background-color 2s ease; }

    body[data-time="dawn"] { background-color: #5a6ab0; }
    body[data-time="dawn"] .stage { filter: brightness(1.02) saturate(1.05); }
    body[data-time="dawn"] .tint {
      opacity: 0.5;
      mix-blend-mode: color;
      background: linear-gradient(to bottom, #5a6ab0 0%, #b89ad0 25%, #f4b2c0 45%, #ffd0a8 60%, transparent 78%);
    }

    body[data-time="sunset"] { background-color: #2e2a6a; }
    body[data-time="sunset"] .stage { filter: saturate(1.3) brightness(0.92); }
    body[data-time="sunset"] .tint {
      opacity: 0.65;
      mix-blend-mode: color;
      background: linear-gradient(to bottom, #2e2a6a 0%, #7a3e94 22%, #e0607a 40%, #ff8a48 55%, #ffb060 66%, transparent 80%);
    }

    body[data-time="night"] { background-color: #070d22; }
    body[data-time="night"] .stage { filter: brightness(0.62) saturate(0.8) hue-rotate(8deg); }
    body[data-time="night"] .tint {
      opacity: 1;
      mix-blend-mode: multiply;
      background: linear-gradient(to bottom, #1a2350 0%, #2a3a7a 60%, #3a4a80 100%);
    }
    body[data-time="night"] .night { opacity: 1; }

    footer {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 27.7% repeat(3, 21.2%);
      padding: clamp(40px, 4.4vw, 84px) 5.5vw 0;
    }

    .brand .logo {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(40px, 3.3vw, 64px);
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .brand .tagline {
      margin-top: clamp(16px, 1.6vw, 30px);
      font-size: clamp(15px, 1.1vw, 21px);
      line-height: 1.45;
      max-width: 20em;
    }

    .brand .copyright {
      margin-top: clamp(16px, 1.6vw, 30px);
      font-size: clamp(13px, 0.92vw, 17.5px);
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .col h2 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(26px, 1.95vw, 37px);
      line-height: 1;
      margin-bottom: clamp(20px, 2.1vw, 40px);
    }

    .col ul { list-style: none; }

    .col li + li { margin-top: clamp(12px, 1.15vw, 22px); }

    .col a {
      color: var(--text);
      text-decoration: none;
      font-size: clamp(15px, 1.1vw, 21px);
      line-height: 1;
      background-image: linear-gradient(currentColor, currentColor);
      background-size: 0% 1.5px;
      background-position: 0 100%;
      background-repeat: no-repeat;
      padding-bottom: 3px;
      transition: background-size 0.3s ease;
    }

    .col a:hover,
    .col a:focus-visible {
      background-size: 100% 1.5px;
      outline: none;
    }

    @media (max-width: 760px) {
      footer {
        grid-template-columns: repeat(3, 1fr);
        row-gap: 28px;
        column-gap: 12px;
        padding: 36px 16px 0;
      }
      .brand { grid-column: 1 / -1; }
      .col h2 { font-size: 22px; margin-bottom: 14px; }
      .col a { font-size: 14px; }
      .col li + li { margin-top: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .col a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <img class="plate" src="scene.jpg" alt="">
    <div class="halo"></div>
    <div class="crt">
      <canvas class="crt-noise" width="160" height="120"></canvas>
      <div class="crt-roll"></div>
      <div class="crt-flash"></div>
      <div class="crt-off"></div>
      <div class="crt-line"></div>
    </div>
    <canvas class="seeds"></canvas>
    <div class="tint"></div>
    <canvas class="night"></canvas>
  </div>

  <footer>
    <div class="brand">
      <div class="logo">hadi</div>
      <p class="tagline">Your tagline goes here,<br>on two short lines</p>
      <p class="copyright">© 2026 Hadi. All rights reserved.</p>
    </div>

    <nav class="col" aria-label="Work">
      <h2>Work</h2>
      <ul>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Experiments</a></li>
        <li><a href="#">Writing</a></li>
        <li><a href="#">Resume</a></li>
      </ul>
    </nav>

    <nav class="col" aria-label="About">
      <h2>About</h2>
      <ul>
        <li><a href="#">About me</a></li>
        <li><a href="#">Now</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <nav class="col" aria-label="Social Media">
      <h2>Social Media</h2>
      <ul>
        <li><a href="https://www.linkedin.com/in/hadialkhub" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://github.com/HadiAlk4" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </nav>
  </footer>

  <script>
    // Picks the scene from the visitor's local clock. Add ?time=night (or
    // dawn / day / sunset) to the URL to preview a scene.
    const override = new URLSearchParams(location.search).get("time");

    function timeOfDay(hour) {
      if (hour >= 5 && hour < 8) return "dawn";
      if (hour >= 8 && hour < 17) return "day";
      if (hour >= 17 && hour < 20) return "sunset";
      return "night";
    }

    function update() {
      document.body.dataset.time = override || timeOfDay(new Date().getHours());
    }

    update();
    setInterval(update, 60 * 1000);

    // Only fade between scenes when the hour changes, not on first load.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add("ready");
    }));

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rand = (min, max) => min + Math.random() * (max - min);

    // CRT flicker: live static, small brightness jitter and the odd dip, with
    // the glow around the Mac breathing along. Never repeats.
    const noise = document.querySelector(".crt-noise");
    const nctx = noise.getContext("2d");
    const noiseData = nctx.createImageData(noise.width, noise.height);
    const flash = document.querySelector(".crt-flash");
    const halo = document.querySelector(".halo");
    let nextFlicker = 0;

    function crt(now) {
      const px = noiseData.data;
      for (let i = 0; i < px.length; i += 4) {
        const v = Math.random() * 255;
        px[i] = px[i + 1] = px[i + 2] = v;
        px[i + 3] = 255;
      }
      nctx.putImageData(noiseData, 0, 0);

      if (now >= nextFlicker) {
        const dip = Math.random() < 0.06;
        flash.style.background = dip ? "#000" : "#fff";
        flash.style.opacity = dip ? rand(0.2, 0.35) : rand(0, 0.22);
        halo.style.opacity = dip ? 0.4 : rand(0.5, 0.75);
        nextFlicker = now + rand(50, 130);
      }
      requestAnimationFrame(crt);
    }

    // Power-on, played once per load: dark glass with a thin line, the line
    // opens into a white flash, then the flash fades to the colour bars.
    const off = document.querySelector(".crt-off");
    const line = document.querySelector(".crt-line");
    const ease = (p) => 1 - (1 - p) ** 3;
    const clamp = (p) => Math.min(Math.max(p, 0), 1);
    let powerStart = null;

    function powerOn(now) {
      powerStart ??= now;
      const t = now - powerStart;
      const open = ease(clamp((t - 350) / 270));
      line.style.transform = `translateY(-50%) scaleY(${0.012 + open * 0.988})`;
      line.style.opacity = 1 - clamp((t - 620) / 480);
      off.style.opacity = 1 - clamp((t - 450) / 170);
      halo.style.opacity = 0.6 * clamp((t - 350) / 550);

      if (t < 1100) {
        requestAnimationFrame(powerOn);
      } else if (!reduceMotion) {
        requestAnimationFrame(crt);
      }
    }

    halo.style.opacity = 0;
    const plate = document.querySelector(".plate");
    if (plate.complete) requestAnimationFrame(powerOn);
    else plate.addEventListener("load", () => requestAnimationFrame(powerOn), { once: true });

    // Dandelion seeds drifting across the scene. Each follows its own random
    // path so the scene never visibly repeats.
    const canvas = document.querySelector(".seeds");
    const ctx = canvas.getContext("2d");
    const SPRITE = 128;

    // A seed seen from below (side = false): fine filaments radiating from a
    // bright centre. Seen side-on (side = true): filaments fanned upward like
    // a parachute. Both have a thin stalk and a small brown achene, softly
    // backlit.
    function makeSprite(blur, side) {
      const c = document.createElement("canvas");
      c.width = c.height = SPRITE;
      const g = c.getContext("2d");
      const cx = SPRITE / 2;
      const cy = SPRITE * (side ? 0.3 : 0.42);
      const r = SPRITE * (side ? 0.22 : 0.26);

      g.filter = `blur(${blur}px)`;
      g.shadowColor = "rgba(255, 244, 225, 0.7)";
      g.shadowBlur = 3 + blur;
      g.lineCap = "round";

      const filaments = 26 + Math.floor(Math.random() * 10);
      for (let i = 0; i < filaments; i++) {
        const a = side
          ? -Math.PI / 2 + ((i / (filaments - 1)) * 2 - 1) * 1.25 + rand(-0.06, 0.06)
          : (i / filaments) * Math.PI * 2 + rand(-0.08, 0.08);
        const len = r * rand(0.75, 1);
        // Side-on filaments rise steeply then splay out, like an umbrella.
        const lift = side ? -len * 0.35 : 0;
        g.strokeStyle = `rgba(255, 252, 245, ${rand(0.45, 0.85)})`;
        g.lineWidth = rand(0.5, 0.9);
        g.beginPath();
        g.moveTo(cx, cy);
        g.quadraticCurveTo(
          cx + Math.cos(a) * len * 0.35 + rand(-1, 1),
          cy + Math.sin(a) * len * 0.5 + lift + rand(-1, 1),
          cx + Math.cos(a) * len,
          cy + Math.sin(a) * len * (side ? 0.55 : 1)
        );
        g.stroke();
        g.fillStyle = "rgba(255, 255, 250, 0.6)";
        g.beginPath();
        g.arc(cx + Math.cos(a) * len, cy + Math.sin(a) * len * (side ? 0.55 : 1), 0.6, 0, Math.PI * 2);
        g.fill();
      }

      const stalk = r * (side ? 1.9 : 1.15);
      g.shadowBlur = 0;
      g.strokeStyle = "rgba(235, 228, 210, 0.75)";
      g.lineWidth = 0.8;
      g.beginPath();
      g.moveTo(cx, cy);
      g.lineTo(cx + 1, cy + stalk);
      g.stroke();

      g.fillStyle = "rgba(120, 92, 60, 0.9)";
      g.beginPath();
      g.ellipse(cx + 1, cy + stalk + 3, 1.3, 3.4, 0.05, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = "rgba(255, 250, 238, 0.95)";
      g.beginPath();
      g.arc(cx, cy, 1.4, 0, Math.PI * 2);
      g.fill();
      return c;
    }

    // Sharp sprites for mid-distance seeds, blurred ones for seeds close to
    // the camera (out of focus) and far away (hazy).
    const sprites = {
      sharp: [false, false, true, true, true].map((side) => makeSprite(0.3, side)),
      soft: [false, true].map((side) => makeSprite(1.2, side)),
      bokeh: [false, true].map((side) => makeSprite(3.5, side)),
    };

    let width = 0;
    let height = 0;
    let seeds = [];

    function makeSeed(fromEdge) {
      const depth = Math.random() ** 1.6; // mostly small and distant
      const near = depth > 0.88;
      const set = near ? sprites.bokeh : depth < 0.25 ? sprites.soft : sprites.sharp;
      return {
        sprite: set[Math.floor(Math.random() * set.length)],
        depth,
        size: (14 + depth * 46) * (width / 1600),
        alpha: near ? rand(0.35, 0.6) : rand(0.55, 0.9),
        x: fromEdge ? -0.05 * width : rand(0, width),
        y: rand(0.08, 0.85) * height,
        vx: (6 + depth * 26) * rand(0.7, 1.3) * (width / 1600),
        vy: rand(-3, 2) * (width / 1600),
        bob: rand(4, 14) * (width / 1600),
        phase: rand(0, Math.PI * 2),
        freq: rand(0.15, 0.45),
        tilt: rand(0.55, 1),
        spin: rand(-0.4, 0.4),
        angle: rand(-0.5, 0.5),
      };
    }

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(22 * (width / 1600)) + 8;
      seeds = Array.from({ length: count }, () => makeSeed(false));
    }

    let last = performance.now();
    function draw(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < seeds.length; i++) {
        const s = seeds[i];
        if (!reduceMotion) {
          s.phase += dt * s.freq * Math.PI * 2;
          s.x += s.vx * dt;
          s.y += (s.vy + Math.cos(s.phase) * s.bob * 0.6) * dt;
          s.angle += s.spin * dt * 0.3 + Math.sin(s.phase) * 0.004;
        }
        if (s.x > width + s.size || s.y < -s.size || s.y > height) {
          seeds[i] = makeSeed(true);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.scale(1, s.tilt);
        ctx.drawImage(s.sprite, -s.size / 2, -s.size * 0.42, s.size, s.size);
        ctx.restore();
      }

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    resize();
    new ResizeObserver(resize).observe(canvas);
    requestAnimationFrame(draw);

    // Night sky: stars that twinkle on their own timing and drift slowly
    // across, plus the occasional shooting star. Only runs at night.
    const sky = document.querySelector(".night");
    const sctx = sky.getContext("2d");
    const HILL = [[0, 96], [8, 91.6], [16, 86.6], [24, 83.3], [28, 82.2], [36, 82],
      [40, 82.9], [60, 80.5], [64, 79.6], [72, 81.6], [80, 82.9], [88, 87], [96, 91.3], [100, 92.4]];
    let sw = 0;
    let sh = 0;
    let drift = 0;
    let shooting = null;
    let nextShooting = performance.now() + rand(3000, 8000);
    let lastSky = performance.now();

    const stars = Array.from({ length: 170 }, () => ({
      x: Math.random(),
      y: Math.random() ** 1.3 * 0.8,
      r: rand(0.35, 1) ** 2 * 1.6 + 0.3,
      base: rand(0.3, 1),
      freq: rand(0.2, 1.4),
      phase: rand(0, Math.PI * 2),
      warm: Math.random() < 0.15,
    }));

    function hillAt(x) {
      const p = x * 100;
      for (let i = 1; i < HILL.length; i++) {
        if (p <= HILL[i][0]) {
          const [x0, y0] = HILL[i - 1];
          const [x1, y1] = HILL[i];
          return (y0 + ((p - x0) / (x1 - x0)) * (y1 - y0)) / 100;
        }
      }
      return 0.92;
    }

    // Behind the Mac or below the hill line, stars are hidden.
    function hidden(x, y) {
      if (y > hillAt(x) - 0.015) return true;
      return x > 0.405 && x < 0.595 && y > 0.445;
    }

    function resizeSky() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      sw = sky.clientWidth;
      sh = sky.clientHeight;
      sky.width = sw * dpr;
      sky.height = sh * dpr;
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawSky(now) {
      const dt = Math.min((now - lastSky) / 1000, 0.1);
      lastSky = now;

      if (document.body.dataset.time !== "night") {
        requestAnimationFrame(drawSky);
        return;
      }

      sctx.clearRect(0, 0, sw, sh);
      const scale = sw / 1600;
      if (!reduceMotion) drift = (drift + dt * 0.0025) % 1;
      const t = now / 1000;

      for (const s of stars) {
        const x = (s.x + drift) % 1;
        const y = s.y + Math.sin((x - 0.5) * 1.2) * 0.02;
        if (hidden(x, y)) continue;
        const tw = reduceMotion ? 1 : 0.55 + 0.45 * Math.sin(t * s.freq * Math.PI * 2 + s.phase);
        sctx.globalAlpha = s.base * tw;
        sctx.fillStyle = s.warm ? "#ffe9c8" : "#eef3ff";
        sctx.beginPath();
        sctx.arc(x * sw, y * sh, s.r * scale, 0, Math.PI * 2);
        sctx.fill();
        if (s.r > 1.3) {
          sctx.globalAlpha *= 0.25;
          sctx.beginPath();
          sctx.arc(x * sw, y * sh, s.r * 2.6 * scale, 0, Math.PI * 2);
          sctx.fill();
        }
      }

      if (!reduceMotion && !shooting && now > nextShooting) {
        const angle = rand(0.3, 0.55);
        shooting = { x: rand(0.1, 0.75) * sw, y: rand(0.04, 0.3) * sh, angle, start: now, life: rand(600, 900) };
      }

      if (shooting) {
        const p = (now - shooting.start) / shooting.life;
        if (p >= 1) {
          shooting = null;
          nextShooting = now + rand(6000, 16000);
        } else {
          const dist = p * 520 * scale;
          const len = 140 * scale * Math.sin(p * Math.PI);
          const hx = shooting.x + Math.cos(shooting.angle) * dist;
          const hy = shooting.y + Math.sin(shooting.angle) * dist;
          const tx = hx - Math.cos(shooting.angle) * len;
          const ty = hy - Math.sin(shooting.angle) * len;
          const grad = sctx.createLinearGradient(hx, hy, tx, ty);
          grad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
          grad.addColorStop(1, "rgba(255, 255, 255, 0)");
          sctx.globalAlpha = Math.sin(p * Math.PI);
          sctx.strokeStyle = grad;
          sctx.lineWidth = 1.4 * scale;
          sctx.lineCap = "round";
          sctx.beginPath();
          sctx.moveTo(hx, hy);
          sctx.lineTo(tx, ty);
          sctx.stroke();
        }
      }

      sctx.globalAlpha = 1;
      requestAnimationFrame(drawSky);
    }

    resizeSky();
    new ResizeObserver(resizeSky).observe(sky);
    requestAnimationFrame(drawSky);
  </script>
</body>
</html>
