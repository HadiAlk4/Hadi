# Rebuilds the blog whenever a post in writing/ changes, then commits the
# generated pages and post list back to main. Publishing a post is just
# adding writing/<slug>.md (locally or on github.com).
name: Build writing

on:
  push:
    branches: [main]
    paths:
      - "writing/**.md"
      - "writing/post.css"
      - "writing/post.js"
      - "time.js"
      - "typewriter.js"
      - "build.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-writing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node build.mjs

      - name: Commit generated files
        run: |
          git add -A writing index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build writing"
          git push
